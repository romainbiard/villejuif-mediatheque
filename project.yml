name: Villejuif
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_LANGUAGE: fr
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Bundle identifiers, App Group and signing team: Config/Shared.xcconfig (neutral values),
# overridden by Config/Local.xcconfig when present (ignored by git).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  Mediatheque:
    path: Packages/Mediatheque

targets:
  Villejuif:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ma médiathèque
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # System launch screen: white crest on the brand magenta, centered on the whole screen.
        # SplashOverlay reuses exactly this image at startup, then fades into the app.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchCrest
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scanner le code-barres d'un livre ou de votre carte d'abonné.
        NSFaceIDUsageDescription: Ouvrir votre compte lecteur sans saisir votre mot de passe.
        # Digital partner apps: detect whether they are installed ("Ouvrir" or "Installer").
        # musicMe has no scheme.
        LSApplicationQueriesSchemes: [arte-mednum, cafeyn, com.toutapprendre.toutapprendre, baobabapp, izneo]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        # Read by the code (SnapshotClient.appGroup): the identifier comes from the xcconfig.
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: App/App.entitlements
      properties:
        # Shared by the app, the widget and the shortcuts: snapshot, notification inbox, settings.
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mediatheques-villejuif
        # No accents: with "é", usernotificationsd doesn't link the bundle to its executable
        # (Unicode normalization) and rejects every notification request.
        PRODUCT_NAME: MaMediatheque
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VillejuifWidget
      - package: Mediatheque
        product: MediathequeCore
      - package: Mediatheque
        product: DesignSystem
      - package: Mediatheque
        product: SearchFeature
      - package: Mediatheque
        product: AgendaFeature
      - package: Mediatheque
        product: InfoFeature
      - package: Mediatheque
        product: AccountFeature
      - package: Mediatheque
        product: DigitalFeature

  VillejuifWidget:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Widget
        excludes: [Info.plist, Widget.entitlements]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Ma médiathèque
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        # Shared by the app, the widget and the shortcuts: snapshot, notification inbox, settings.
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mediatheques-villejuif.widget
        PRODUCT_NAME: VillejuifWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: Mediatheque
        product: MediathequeCore
