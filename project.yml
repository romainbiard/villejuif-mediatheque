name: Mediatheque
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_LANGUAGE: fr
    # Off by default in an XcodeGen project: without them, Xcode finds none of the App and Widget
    # texts in the code and marks every key of their String Catalogs as stale.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

# Bundle identifiers, App Group, signing team and version: Config/Shared.xcconfig (neutral values),
# overridden by Config/Local.xcconfig when present (ignored by git; written by
# ci_scripts/ci_post_clone.sh on Xcode Cloud).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  Mediatheque:
    path: Packages/Mediatheque

targets:
  Mediatheque:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Médiathèque
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # System launch screen: white crest on the brand magenta, centered on the whole screen.
        # SplashOverlay reuses exactly this image at startup, then fades into the app.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchCrest
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Every orientation (EN 301 549 / WCAG 1.3.4): a patron with the iPhone on a stand isn't stuck in portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # HTTPS only (exempt): no export compliance question on every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scanner le code-barres d'un livre ou de votre carte d'abonné.
        NSFaceIDUsageDescription: Ouvrir votre compte lecteur sans saisir votre mot de passe.
        # Digital partner apps: detect whether they are installed ("Ouvrir" or "Installer").
        # musicMe has no scheme.
        LSApplicationQueriesSchemes: [arte-mednum, cafeyn, com.toutapprendre.toutapprendre, baobabapp, izneo]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        # Read by the code (SnapshotClient.appGroup): the identifier comes from the xcconfig.
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: App/App.entitlements
      properties:
        # Shared by the app, the widget and the shortcuts: snapshot, notification inbox, settings.
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mediatheques-villejuif
        # No accents: with "é", usernotificationsd doesn't link the bundle to its executable
        # (Unicode normalization) and rejects every notification request.
        PRODUCT_NAME: Mediatheque
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MediathequeWidget
      - package: Mediatheque
        product: MediathequeCore
      - package: Mediatheque
        product: DesignSystem
      - package: Mediatheque
        product: SearchFeature
      - package: Mediatheque
        product: AgendaFeature
      - package: Mediatheque
        product: InfoFeature
      - package: Mediatheque
        product: AccountFeature
      - package: Mediatheque
        product: DigitalFeature

  MediathequeWidget:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Widget
        excludes: [Info.plist, Widget.entitlements]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Médiathèque
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        # Shared by the app, the widget and the shortcuts: snapshot, notification inbox, settings.
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mediatheques-villejuif.widget
        PRODUCT_NAME: MediathequeWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: Mediatheque
        product: MediathequeCore

  # Drives the app like a patron, on the preview data (see App/UITesting.swift): no network, no account.
  MediathequeUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mediatheques-villejuif.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Mediatheque

# Shared scheme: Xcode Cloud only sees schemes stored in xcshareddata.
schemes:
  Mediatheque:
    build:
      targets:
        Mediatheque: all
    test:
      config: Debug
      # Code coverage in Xcode's report navigator after each test run.
      gatherCoverageData: true
      # The tests check French texts: same as -testLanguage fr -testRegion FR.
      language: fr
      region: FR
      # Not Paris on purpose: Xcode Cloud's simulators aren't either, and every date must still read in Paris time.
      environmentVariables:
        TZ: America/Los_Angeles
      targets:
        - package: Mediatheque/BokehAPITests
        - package: Mediatheque/MediathequeCoreTests
        - package: Mediatheque/FeatureTests
        - MediathequeUITests
    archive:
      config: Release
