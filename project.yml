name: Villejuif
options:
  bundleIdPrefix: com.rbiard
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_LANGUAGE: fr
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Mediatheque:
    path: Packages/Mediatheque

targets:
  Villejuif:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Médiathèques
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scanner le code-barres d'un livre ou de votre carte d'abonné.
        NSFaceIDUsageDescription: Ouvrir votre compte lecteur sans saisir votre mot de passe.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.rbiard.mediatheques-villejuif.refresh]
    entitlements:
      path: App/App.entitlements
      properties:
        # Partagé par l'app, le widget et les raccourcis : snapshot, boîte de notifications, réglages.
        com.apple.security.application-groups: [group.com.rbiard.mediatheques-villejuif]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbiard.mediatheques-villejuif
        PRODUCT_NAME: Médiathèques
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VillejuifWidget
      - package: Mediatheque
        product: MediathequeCore
      - package: Mediatheque
        product: DesignSystem
      - package: Mediatheque
        product: SearchFeature
      - package: Mediatheque
        product: AgendaFeature
      - package: Mediatheque
        product: InfoFeature
      - package: Mediatheque
        product: AccountFeature
      - package: Mediatheque
        product: DigitalFeature

  VillejuifWidget:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Widget
        excludes: [Info.plist, Widget.entitlements]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Médiathèques
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        # Partagé par l'app, le widget et les raccourcis : snapshot, boîte de notifications, réglages.
        com.apple.security.application-groups: [group.com.rbiard.mediatheques-villejuif]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbiard.mediatheques-villejuif.widget
        PRODUCT_NAME: VillejuifWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: Mediatheque
        product: MediathequeCore
